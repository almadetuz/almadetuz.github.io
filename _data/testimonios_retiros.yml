# Testimonios del carrusel de /booking/retiros/.
#
# Nosotras Fest, soyclicmani y monicamarcos son comentarios reales del post de
# Nosotras Fest en Instagram (https://www.instagram.com/p/Dcq083gNtJ5/). El
# recorte de cada cita, y por qué se corta donde se corta, está en la sección 9
# de `_drafts/booking-retiros-concierto.md`. El resto son mensajes directos a
# Amanda, recortados con la misma regla de protagonismo.
#
# slug - nombre fijo del testimonio en los eventos, en kebab-case a partir del
#   nick (sin nick, del nombre). No se cambia nunca, aunque cambie el nick.
# nick - opcional. Sin nick el mensaje no vino de Instagram y la ficha no lleva
#   el icono.
# avatar - opcional. Sin avatar la ficha muestra la inicial.
#
# TODO: pedir permiso a todas para publicarlos.
# TODO: conseguir los avatares de Miriam y Laura, que escribieron por email.

- name: Nosotras Fest
  slug: nosotras-fest
  nick: "@nosotras.fest"
  role: organizadoras
  avatar: /assets/images/avatar/nosotras_fest.jpg
  quote: >-
    Qué placer de noche con tu arte, con tus palabras, tus historias, esa
    presencia generosa y contundente, dulce y chistosa a la vez. Nos dejaste
    prendadas.

- name: Xamara
  slug: xamarabienestar
  nick: "@xamarabienestar"
  role: organizadora
  avatar: /assets/images/avatar/xamarabienestar.jpg
  quote: >-
    Muchas gracias por todo, la experiencia fue extraordinaria. Puntualidad,
    profesionalidad, presencia y cercanía. Amanda y compañía se adaptaron
    perfectamente a lo que habíamos hablado, tanto el contenido enfocado
    totalmente a nuestro encuentro con una sensibilidad exquisita como el
    continente con todos los medios técnicos y el sonido perfecto.

- name: Laura Mora
  slug: lauramoradamaya
  nick: "@lauramoradamaya"
  role: participante
  avatar: /assets/images/avatar/lauramoradamaya.jpg
  quote: >-
    Sentir el acompañamiento de Amanda con su conocimiento de lo humano, su
    música, su mirada, sus manos y su voz es una experiencia placentera y
    profunda. Cuando sé que ella forma parte de algo, que está creando, que
    invita a crear, respondo a su llamada y voy. Sin más, con confianza, sabiendo
    que es un buen lugar donde Ser.

  # Sin nombre real: la ficha se queda con el nick en la primera línea.
- nick: "@soyclicmani"
  slug: soyclicmani
  role: participante
  avatar: /assets/images/avatar/soyclicmani.jpg
  quote: >-
    Me enamoró verte en directo. Una voz preciosa y una presencia amorosa que se
    notaba en cada nota que salía de tu voz. Gracias. Una mami con baby que te
    miraba desde el sillón con admiración y fascinación mientras mi bebé dormía
    en el porteo.

  # Sin nombre real: la ficha se queda con el nick en la primera línea.
- nick: "@monicamarcos.es"
  slug: monicamarcos-es
  role: participante
  avatar: /assets/images/avatar/monicamarcos_es.jpg
  quote: >-
    Que bonitooooo, fue una noche mágica que aún vibra en mi corazón. Gracias
    Amanda, gracias a todas Nosotras por este encuentro festival tan hermoso y
    revitalizador, juntas recordamos!!

  # Sin nombre real: la ficha se queda con el nick en la primera línea.
- nick: "@mariannadipasca"
  slug: mariannadipasca
  role: participante
  avatar: /assets/images/avatar/mariannadipasca.jpg
  quote: >-
    Oh Amanda, has sido el descubrimiento más bonito del festival! Me ha
    encantado conocerte.

- name: Miriam
  slug: miriam-r
  role: participante
  quote: >-
    Me encantó muchísimo tus canciones, tu música y tu energía, divertida y a la
    vez profunda.

- name: Laura
  slug: laura-c
  role: participante
  quote: >-
    Ayer fue un regalazo poder escucharte, cuánta belleza junta...
