---
layout: tracking
sitemap: false
---
<div class="container text-center mt-5"
  style="min-height: 50vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
  <div class="text-primary spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <h2 class="mt-3">Redirigiendo...</h2>
  <p class="text-muted">Por favor espere un momento.</p>
  <p class="text-muted">Si no se redirige automáticamente,<br><a id="manual-redirect-link" href="#" target="_self">haz
      clic aquí</a>.
  </p>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // u: web (http/https) destination (must be in _data/redirect_hosts.yml), e: event, p: props, v: value, t: ignored
    const redirect = AdtTracking.readRedirect(window.location.search);
    if (!redirect.url) {
      document.querySelector('.container').innerHTML = '<div class="alert alert-danger">Error: No se ha especificado una URL de destino válida.</div>';
      return;
    }
    document.getElementById('manual-redirect-link').href = redirect.url;
    trackAndGo(redirect.name, redirect.props, redirect.url, '_self');
  });
</script>
